name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable version tag for an immutable Draft; the selected workflow ref must match that tag
        required: true
        type: string
      publish_release:
        description: Publish the verified Draft only after the release owner approves production publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the shared offline validation entry point
        run: python tools/run_checks.py --profile ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && 'adversarial' || 'standard' }} --report build/validation/report.json
      - name: Decode offline QR fixtures independently
        if: matrix.python == '3.14' && runner.os == 'Linux'
        run: |
          python3 -m venv "${RUNNER_TEMP}/qr-validator"
          "${RUNNER_TEMP}/qr-validator/bin/python" -m pip install --only-binary=:all: -r tests/requirements-qr-test.txt
          "${RUNNER_TEMP}/qr-validator/bin/python" tools/validate_qr.py

      - name: Upload validation reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.os }}-python-${{ matrix.python }}
          path: build/validation/
          if-no-files-found: error
          retention-days: 14

  official-skill-validation:
    name: Official Skill validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Run pinned OpenAI quick_validate.py in an isolated environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/skill-validator"
          "${RUNNER_TEMP}/skill-validator/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          curl -fsSL "https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py" -o "${RUNNER_TEMP}/quick_validate.py"
          "${RUNNER_TEMP}/skill-validator/bin/python" "${RUNNER_TEMP}/quick_validate.py" holycrab

  generate-contract:
    name: Recorded Generate contract (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Identify the version for explicitly authorized local checks
        id: contract-version
        run: echo "version=$(sed -n 's/^VERSION=//p' install.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Verify candidate-bound recorded Generate contract evidence
        run: python3 tools/verify_release_acceptance.py "${{ steps.contract-version.outputs.version }}" --contract-only

  install-and-mcp:
    name: Install and MCP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"
      - name: Install from the checked-out release source
        env:
          HOLYCRAB_NO_UPDATE_CHECK: "1"
          HOLYCRAB_EXPECTED_VERSION: "0.6.0"
          HOLYCRAB_INSTALL_SOURCE_DIR: ${{ github.workspace }}
          HOLYCRAB_INSTALL_MCP: "0"
          HOLYCRAB_INSTALL_AGENTS: codex,claude
          HOLYCRAB_INSTALL_PREFIX: ${{ runner.temp }}/holycrab-prefix
          HOLYCRAB_CONFIG_DIR: ${{ runner.temp }}/holycrab-config
        run: |
          sh install.sh
          test -x "${HOLYCRAB_INSTALL_PREFIX}/bin/holycrab"
          test -f "${HOME}/.agents/skills/holycrab/agents/openai.yaml"
          test -f "${HOME}/.claude/skills/holycrab/agents/openai.yaml"
          "${HOLYCRAB_INSTALL_PREFIX}/bin/holycrab" --version | grep "${HOLYCRAB_EXPECTED_VERSION}"
          "${HOLYCRAB_INSTALL_PREFIX}/bin/holycrab" doctor --json > "${RUNNER_TEMP}/doctor.json"
          python3 -c 'import json, os, pathlib; data=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("doctor.json").read_text()); assert data["ok"] is True and data["checks"]["config"]["keyConfigured"] is False'
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | "${HOLYCRAB_INSTALL_PREFIX}/bin/holycrab" mcp serve > "${RUNNER_TEMP}/mcp.json"
          python3 -c 'import json, os, pathlib; data=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("mcp.json").read_text()); assert data["result"]["serverInfo"]["name"] == "holycrab-local"'

  install-windows:
    name: Native Windows (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            python: "3.10"
            architecture: x64
          - os: windows-2025
            python: "3.14"
            architecture: x64
          - os: windows-2022
            python: "3.10"
            architecture: x64
          - os: windows-11-arm
            python: "3.14"
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Complete portable Windows tests without blanket module skips
        run: python tools/run_checks.py --report build/validation/report.json
      - name: Verify recorded contract fingerprint on native Windows
        run: python tools/verify_release_acceptance.py v0.6.0 --contract-only
      - name: Actual installed HTTP workflows
        if: always()
        run: python tools/run_checks.py --unit-worker build/validation/http-results.json --test-name tests.adversarial.check_http_flows
      - name: Ordinary-user native lifecycle and real console validation
        if: always()
        shell: powershell
        run: .\tests\test_windows_adversarial.ps1 -Report build/validation/windows-native.json
      - name: Reject missing native equivalents and stale evidence
        if: always()
        run: python tools/verify_windows_coverage.py --unit build/validation/unit-results.json --native build/validation/windows-native.json --report build/validation/windows-coverage.json --expected-architecture ${{ matrix.architecture }} --expected-python ${{ matrix.python }}
      - name: Upload Windows evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.os }}-python-${{ matrix.python }}
          path: build/validation/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Prepare verified Draft assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [quality, official-skill-validation, generate-contract, install-and-mcp, install-windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          release_version="$RELEASE_VERSION"
          grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$release_version"
          git fetch --no-tags origin "refs/tags/$release_version:refs/tags/$release_version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$release_version^{commit}")"
          grep -Fx "VERSION=$release_version" install.sh
          grep -Fx '$Version = "'"$release_version"'"' install.ps1
          test -f ".github/releases/$release_version.md"
          python3 tools/verify_release_acceptance.py "$release_version"
          sh -n install.sh
          sha256sum install.sh install.ps1 > SHA256SUMS
      - name: Create the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="$RELEASE_VERSION"
          if gh release view "$release_version" >/dev/null 2>&1; then
            test "$(gh release view "$release_version" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$release_version" --json isPrerelease --jq .isPrerelease)" = false
            echo "Existing Draft assets will only be verified, never overwritten."
            exit 0
          fi
          gh release create "$release_version" install.sh install.ps1 SHA256SUMS \
            --verify-tag \
            --draft \
            --title "HolyCrab Agent Tools $release_version" \
            --notes-file ".github/releases/$release_version.md"
      - name: Verify published bytes and GitHub SHA-256 digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="$RELEASE_VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq --arg version "$release_version" '[.[] | select(.tag_name == $version)] | if length == 1 then .[0] else error("Expected exactly one Draft Release") end' \
            > "${RUNNER_TEMP}/release.json"
          python3 - "${RUNNER_TEMP}/release.json" <<'PY'
          import hashlib, json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert release.get("draft") is True and release.get("prerelease") is False
          assets = {item["name"]: item for item in release.get("assets", [])}
          for name in ("install.sh", "install.ps1", "SHA256SUMS"):
              expected = "sha256:" + hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              assert assets.get(name, {}).get("digest") == expected, f"GitHub digest mismatch: {name}"
          PY
          mkdir -p "${RUNNER_TEMP}/published"
          gh release download "$release_version" --dir "${RUNNER_TEMP}/published" \
            --pattern install.sh --pattern install.ps1 --pattern SHA256SUMS
          cmp install.sh "${RUNNER_TEMP}/published/install.sh"
          cmp install.ps1 "${RUNNER_TEMP}/published/install.ps1"
          cmp SHA256SUMS "${RUNNER_TEMP}/published/SHA256SUMS"

  verify-draft-install:
    name: Verify draft installation (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [release]
    # GitHub only exposes Draft assets to identities with push access. This
    # job does not mutate releases; no token is passed to the installer.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"
      - name: Download verified Draft assets without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_VERSION" --dir "${RUNNER_TEMP}/draft-assets" \
            --pattern install.sh --pattern install.ps1 --pattern SHA256SUMS
          cmp install.sh "${RUNNER_TEMP}/draft-assets/install.sh"
          cmp install.ps1 "${RUNNER_TEMP}/draft-assets/install.ps1"
          cd "${RUNNER_TEMP}/draft-assets"
          python - <<'PY'
          import hashlib, pathlib
          expected = dict((name, digest) for digest, name in (line.split() for line in pathlib.Path('SHA256SUMS').read_text().splitlines()))
          assert set(expected) == {'install.sh', 'install.ps1'}
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          PY
      - name: Install Draft bytes on Unix
        if: runner.os != 'Windows'
        env:
          HOLYCRAB_INSTALL_PREFIX: ${{ runner.temp }}/draft-prefix
          HOLYCRAB_CONFIG_DIR: ${{ runner.temp }}/draft-config
          HOLYCRAB_INSTALL_AGENTS: none
          HOLYCRAB_INSTALL_MCP: "0"
          HOLYCRAB_NO_UPDATE_CHECK: "1"
        shell: bash
        run: |
          set -euo pipefail
          unset HOLYCRAB_INSTALL_REF HOLYCRAB_INSTALL_SOURCE_DIR
          sh "${RUNNER_TEMP}/draft-assets/install.sh"
          test "$("${HOLYCRAB_INSTALL_PREFIX}/bin/holycrab" --version)" = "holycrab ${RELEASE_VERSION#v}"
          "${HOLYCRAB_INSTALL_PREFIX}/bin/holycrab" doctor --json
          "${HOLYCRAB_INSTALL_PREFIX}/bin/holycrab" uninstall --help
          "${HOLYCRAB_INSTALL_PREFIX}/bin/holycrab" uninstall --yes --purge
      - name: Install Draft bytes on native PowerShell 5.1
        if: runner.os == 'Windows'
        env:
          HOLYCRAB_INSTALL_PREFIX: ${{ runner.temp }}/draft-prefix
          HOLYCRAB_CONFIG_DIR: ${{ runner.temp }}/draft-config
          HOLYCRAB_INSTALL_AGENTS: none
          HOLYCRAB_INSTALL_MCP: "0"
          HOLYCRAB_NO_UPDATE_CHECK: "1"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:HOLYCRAB_INSTALL_REF = $null
          $env:HOLYCRAB_INSTALL_SOURCE_DIR = $null
          & (Join-Path $env:RUNNER_TEMP "draft-assets/install.ps1")
          if ($LASTEXITCODE -ne 0) { throw "Draft installation failed" }
          $Launcher = Join-Path $env:HOLYCRAB_INSTALL_PREFIX "bin/holycrab.cmd"
          if ((& $Launcher --version) -ne ("holycrab " + $env:RELEASE_VERSION.Substring(1))) { throw "Draft version mismatch" }
          $Doctor = & $Launcher doctor --json | ConvertFrom-Json
          if ($Doctor.ok -ne $true) { throw "Draft health checks failed" }
          & $Launcher uninstall --help
          & $Launcher uninstall --yes --purge
          if ($LASTEXITCODE -ne 0) { throw "Draft uninstall failed" }
          $Deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ((Test-Path $Launcher) -and [DateTime]::UtcNow -lt $Deadline) { Start-Sleep -Milliseconds 100 }
          if ((Test-Path $Launcher) -or (Test-Path (Join-Path $env:HOLYCRAB_INSTALL_PREFIX "lib/holycrab"))) { throw "Draft cleanup did not complete within 10 seconds" }

  publish-verified-release:
    name: Publish verified release as Latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    needs: [release, verify-draft-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish only after immutable asset and native installation verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_release_acceptance.py "$RELEASE_VERSION"
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_VERSION" --draft=false --latest
